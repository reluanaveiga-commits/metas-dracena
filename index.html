<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <title>Controle de Metas</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- SPRITE DE ÍCONES (não é exibido, só serve de referência para os <use>) -->
    <svg style="display:none" aria-hidden="true">
        <symbol id="icon-cidade" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 21s7-6.5 7-12a7 7 0 1 0-14 0c0 5.5 7 12 7 12z"/>
            <circle cx="12" cy="9" r="2.5"/>
        </symbol>
        <symbol id="icon-upload" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 16V4M12 4l-4 4M12 4l4 4"/>
            <path d="M4 16v3a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-3"/>
        </symbol>
        <symbol id="icon-meta" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="9"/>
            <circle cx="12" cy="12" r="5"/>
            <circle cx="12" cy="12" r="1"/>
        </symbol>
        <symbol id="icon-calculadora" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="4" y="2" width="16" height="20" rx="2"/>
            <line x1="8" y1="7" x2="16" y2="7"/>
            <line x1="8" y1="12" x2="8" y2="12"/>
            <line x1="12" y1="12" x2="12" y2="12"/>
            <line x1="16" y1="12" x2="16" y2="12"/>
            <line x1="8" y1="16" x2="8" y2="16"/>
            <line x1="12" y1="16" x2="12" y2="16"/>
            <line x1="16" y1="16" x2="16" y2="16"/>
        </symbol>
        <symbol id="icon-pessoas" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="9" cy="8" r="3.2"/>
            <path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/>
            <circle cx="17" cy="8" r="2.6"/>
            <path d="M16 14.2c2.4.5 4 2.6 4 5.8"/>
        </symbol>
        <symbol id="icon-mais" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <line x1="12" y1="5" x2="12" y2="19"/>
            <line x1="5" y1="12" x2="19" y2="12"/>
        </symbol>
        <symbol id="icon-lixeira" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/>
            <path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"/>
        </symbol>
        <symbol id="icon-calendario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
        </symbol>
        <symbol id="icon-pdf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
            <polyline points="14 2 14 8 20 8"/>
        </symbol>
        <symbol id="icon-excel" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2"/>
            <line x1="3" y1="9" x2="21" y2="9"/>
            <line x1="9" y1="9" x2="9" y2="21"/>
        </symbol>
        <symbol id="icon-sair" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
            <polyline points="16 17 21 12 16 7"/>
            <line x1="21" y1="12" x2="9" y2="12"/>
        </symbol>
        <symbol id="icon-usuario" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"/>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"/>
        </symbol>
        <symbol id="icon-cadeado" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="11" width="14" height="10" rx="2"/>
            <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </symbol>
        <symbol id="icon-filtro" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="4 4 20 4 14 12.5 14 19 10 21 10 12.5 4 4"/>
        </symbol>
        <symbol id="icon-reset" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"/>
            <polyline points="3 3 3 8 8 8"/>
        </symbol>
    </svg>

    <div id="loginScreen" class="login">
        <div class="login-box">
            <img src="logo.png" alt="Logo" class="login-logo">
            <h2>Controle de Metas</h2>
            <p class="login-sub">Acesse com seu usuário e senha</p>

            <form id="loginForm" onsubmit="entrar(); return false;">
                <label class="campo-icone">
                    <svg class="icon"><use href="#icon-usuario"></use></svg>
                    <input type="text" id="usuario" placeholder="Usuário" autocomplete="username" required>
                </label>
                <label class="campo-icone">
                    <svg class="icon"><use href="#icon-cadeado"></use></svg>
                    <input type="password" id="senha" placeholder="Senha" autocomplete="current-password" required>
                </label>

                <button type="submit">Entrar</button>
            </form>

            <p id="erro"></p>
        </div>
    </div>

    <div id="app" style="display:none;">

        <!-- HEADER -->
        <header class="topo">
            <div class="brand">
                <img src="logo.png" alt="Logo" class="logo">
                <div>
                    <h1>Controle de Metas</h1>
                    <span>Sistema de gestão de vendas</span>
                </div>
            </div>
            <button class="btn-sair" onclick="sair()">
                <svg class="icon"><use href="#icon-sair"></use></svg>
                <span>Sair</span>
            </button>
        </header>

        <main class="container">

            <div class="grid">

                <!-- CIDADE -->
                <div class="card">
                    <h3><svg class="icon"><use href="#icon-cidade"></use></svg> Cidade</h3>
                    <select id="cidade">
                        <option value="">Selecione a cidade</option>
                        <option value="Dracena">Dracena</option>
                        <option value="Panorama">Panorama</option>
                        <option value="Tupi Paulista">Tupi Paulista</option>
                        <option value="Junqueirópolis">Junqueirópolis</option>
                        <option value="Ikeda">Ikeda</option>
                        <option value="Paulicéia">Paulicéia</option>
                    </select>
                </div>

                <!-- PLANILHA -->
                <div class="card">
                    <h3><svg class="icon"><use href="#icon-upload"></use></svg> Importar Planilha</h3>
                    <input type="file" id="inputExcel" accept=".xlsx, .xls, .csv">
                    <button onclick="lerPlanilha()">
                        <svg class="icon"><use href="#icon-upload"></use></svg>
                        <span>Carregar Planilha</span>
                    </button>
                </div>

                <!-- METAS -->
                <div class="card">
                    <h3><svg class="icon"><use href="#icon-meta"></use></svg> Metas</h3>

                    <label>Venda ano passado (R$)</label>
                    <input type="text" id="anoPassado">

                    <label>% Crescimento</label>
                    <input type="number" id="percentual" placeholder="Ex: 10">

                    <label class="check">
                        <input type="checkbox" id="abrirDomingo">
                        <span>Trabalhar aos domingos</span>
                    </label>
                    <label class="check">
                        <input type="checkbox" id="trabalharFeriado">
                        <span>Trabalhar em feriados</span>
                    </label>

                    <button onclick="calcularMeta()">
                        <svg class="icon"><use href="#icon-calculadora"></use></svg>
                        <span>Calcular Meta</span>
                    </button>

                    <h2 id="metaResultado"></h2>
                </div>

                <!-- FUNCIONÁRIAS -->
                <div class="card">
                    <h3><svg class="icon"><use href="#icon-pessoas"></use></svg> Funcionárias</h3>
                    <div id="listaFuncionarias"></div>
                    <div id="totalPercentual" class="total-percentual"></div>
                    <div class="button-row">
                        <button onclick="adicionarFuncionaria()">
                            <svg class="icon"><use href="#icon-mais"></use></svg>
                            <span>Adicionar</span>
                        </button>
                        <button class="btn-secundario" onclick="resetarPercentuais()">
                            <svg class="icon"><use href="#icon-reset"></use></svg>
                            <span>Redefinir %</span>
                        </button>
                    </div>
                </div>

                <!-- VENDAS POR DIA (FULL WIDTH) -->
                <div class="card full">
                    <h3><svg class="icon"><use href="#icon-calendario"></use></svg> Vendas por Dia</h3>

                    <label><svg class="icon icon-inline"><use href="#icon-filtro"></use></svg> Filtrar Funcionária</label>
                    <select id="filtro" onchange="filtrarTabela()">
                        <option value="todas">Todas</option>
                    </select>

                    <div id="dias"></div>
                </div>

            </div>

        </main>

        <!-- ACESSO RÁPIDO À EXPORTAÇÃO (fica visível mesmo rolando a tabela) -->
        <div class="fab-export">
            <button onclick="exportarPDF()" title="Exportar PDF">
                <svg class="icon"><use href="#icon-pdf"></use></svg>
            </button>
            <button onclick="exportarExcel()" title="Exportar Excel">
                <svg class="icon"><use href="#icon-excel"></use></svg>
            </button>
        </div>
    </div>

    <!-- LIBS -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="script.js"></script>
</body>

</html>
